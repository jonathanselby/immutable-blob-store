name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o ./bin/blobstore ./cmd/blobstore
      - name: Version contract
        run: test "$(./bin/blobstore -version)" = "blobstore 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/blobstore-linux-arm64 ./cmd/blobstore
      - name: Bafflewick acceptance
        shell: bash
        run: |
          set -euo pipefail
          store=$(mktemp -d)
          output=$(mktemp)
          rm -f "$output"
          result=$(./bin/blobstore put -store "$store" -file examples/bafflewick/evidence.html -max-bytes 1048576)
          id=$(printf '%s' "$result" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$id"
          ./bin/blobstore verify -store "$store" -id "$id" | grep -q '"sha256"'
          ./bin/blobstore get -store "$store" -id "$id" -output "$output" | grep -q '"id"'
          cmp examples/bafflewick/evidence.html "$output"
      - name: Blob-boundary acceptance
        run: >-
          go test ./internal/blobstore
          -run 'TestPutVerifyAndCopyExactBytes|TestOversizeLeavesNoDurableBlob|TestDuplicateIsIdempotent|TestConcurrentDuplicateCommit|TestTamperDetected|TestInvalidIDAndTraversalRefused|TestOpaqueHostileLookingBytesPreserved|TestSafeDownloadHeaders|TestCancelledIngestDoesNotCommit|TestStoredBlobUsesPrivatePermissions'
          -count=1
